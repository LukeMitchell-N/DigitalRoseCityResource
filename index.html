<!DOCTYPE html>
<html lang="en">
<head>
    <title>Digital Rose City Resource</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Leaflet: -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"
          integrity="sha256-kLaT2GOSpHechhsozzB+flnD+zUyjE2LlfWPgU04xyI="
          crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"
            integrity="sha256-WBkoXOwTeyKclOHuWtc+i2uENFpDZ9YPdf5Hf+D7ewM="
            crossorigin=""></script>
    <!-- Leaflet MarkerCluster Custom Behavior: -->
    <script type='text/javascript'>
        var map = null;     /// Global variable
    </script>
    <script type="module" src="CustomClustering.js"></script>
    <link rel="stylesheet" href="CustomClustering.css">
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <!-- Bootstrap: -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- FontAwesome: -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="sidebar.css">
    <link rel="stylesheet" href="leafletPageStyle.css">
    <script type="module" src="./icons/icons.js"></script>
</head>
<body>

    <div translate="no" class="d-flex">
        <nav id="map-nav" class="nav sidebar d-flex flex-column flex-shrink-0 position-fixed">
            <div id ="upper-box"class="row-1 nav-section flex-grow-1 d-flex flex-column g-0">
                <div class="row flex-shrink-0 g-0">
                    <button type="button" class="icon-button col-auto btn flex-auto"  onclick="toggleSidebar()">
                        <i class="fa-solid fa-bars sidebar-link"></i>
                    </button>
                    <div class="col flex-grow-1 hide-on-collapse" style="margin-left: 3px;">
                        <input id="org-search" type="search" class="form-control search-bar search-bar-left" placeholder="Search Organizations...">
                    </div>
                    <button id="org-search-enter" class="col col-auto icon-button flex-auto btn btn-primary terminating hide-on-collapse">
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                    
                </div>
                <div class="row flex-shrink-0 g-0">
                    <div class="search-container col flex-grow-1 hide-on-collapse">
                        <input type="text" class="form-control search-bar" placeholder="Test item 2">
                    </div>
                </div>
                <div class="row flex-shrink-0 overflow-auto g-0">
                    <div class="search-container col flex-grow-1 hide-on-collapse">
                        <input type="text" class="form-control search-bar" placeholder="Test item 3">
                    </div>
                </div>
                <div id="search-results" class="row flex-grow-1 hide-on-collapse overflow-auto">
                    <div class="organization-result">test search result 1</div>
                    <div class="organization-result">test search result  2</div>
                    <div class="organization-result">test search result  3</div>
                    <div class="organization-result">test search result  4</div>
                    <div class="organization-result">test search result  5</div>
                    <div class="organization-result">test search result  6</div>
                    <div class="organization-result">test search result  7</div>
                    <div class="organization-result">test search result  8</div>
                </div>


            </div>

            <div id="lower-box" class="row-1 nav-section overflow-auto hide-on-collapse hidden">
                <div class="overflow-auto" style="height:100%">
                    <div class="flex-column">
                        <div class="row" style="padding-top: 10px;">
                            <div class="col-auto">
                                <h5 id="organization-name">Organization</h5>
                            </div>
                        </div>
                        <div class="row address-row">
                            <div class="col flex-grow-1">
                                <p><small id="organization-address"></small></p>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col flex-grow-1">
                                <p><small id="organization-phone"></small></p>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col flex-grow-1">
                                <p id="organization-section"></p>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col flex-grow-1">
                                <p id="organization-description"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <main class="main-content">
            <div id="myMap" class="container-fluid">

                <script type="module" src="leafletMap.js">
                </script>

            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('collapsed');
            document.querySelector('.leaflet-left').classList.toggle('collapsed')
        }
    </script>
</body>
</html>
