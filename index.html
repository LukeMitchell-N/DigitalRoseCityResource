<!DOCTYPE html>
<html lang="en">
<head>
    <title>Digital Rose City Resource</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Leaflet: -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"
          integrity="sha256-kLaT2GOSpHechhsozzB+flnD+zUyjE2LlfWPgU04xyI="
          crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"
            integrity="sha256-WBkoXOwTeyKclOHuWtc+i2uENFpDZ9YPdf5Hf+D7ewM="
            crossorigin=""></script>
    <!-- Leaflet MarkerCluster Custom Behavior: -->
    <script type='text/javascript'>
        var map = null;     /// Global variable
    </script>
    <script type="module" src="CustomClustering.js"></script>
    <link rel="stylesheet" href="CustomClustering.css">
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <!-- Bootstrap: -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- FontAwesome: -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="sidebar.css">
    <link rel="stylesheet" href="leafletPageStyle.css">
    <script type="module" src="./icons/icons.js"></script>
</head>
<body>
    <div class="d-flex flex-row h-100">
        <div id="sidebar" class="d-flex flex-column h-100 border-end ">
            <div id="sidebar-upper-box" class="nav-section d-flex flex-column flex-grow-1 ">
                <div id="search-row" class="d-flex flex-row flex-shrink-0">
                    <button type="button" class="icon-button col-auto btn flex-auto" onclick="toggleSidebar()">
                        <!-- <i class="fa-solid fa-bars ui-button button-lt"></i> -->
                        <img src="./icons/bars-solid.svg" alt="" aria-hidden="true" width="30" height="30" class="ui-button button-lt svg">
                    </button>
                    <div class="col flex-grow-1 hide-on-collapse" style="margin-left: 3px;">
                        <input id="org-search" type="search" class="form-control-sm search-bar w-100" placeholder="Search Organizations...">
                    </div>
                </div>

                <div class="dropdown flex-row hide-on-collapse">
                    <button id="countyDropdownButton" class="btn btn-secondary btn-sm dropdown-toggle w-100" type="button" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        County
                    </button>
                    <ul id="countyDropdown" class="dropdown-menu w-100" aria-labelledby="countyDropdownButton">
                    </ul>
                </div>
                <div class="dropdown flex-row hide-on-collapse">
                    <button id="resourceDropdownButton" class="btn btn-secondary btn-sm dropdown-toggle w-100" type="button" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        Resource Type
                    </button>

                    <ul id="resourceDropdown" class="dropdown-menu w-100" aria-labelledby="resourceDropdownButton">
                    </ul>
                </div>

                <div class="flex-row hide-on-collapse">
                    <button id="org-search-enter" class="btn btn-primary btn-sm w-100">
                        Filter
                    </button>
                </div>
                <div id="search-results" class="flex-grow-1 w-100 overflow-auto hide-on-collapse">
                </div>

            </div>

            <div id="sidebar-lower-box" class="row-1 nav-section overflow-auto flex-grow-1 hidden hide-on-collapse">
                <div class="overflow-auto h-100">
                    <div class="flex-column">
                        <div class="row" style="padding-top: 10px;">
                            <div class="col-auto">
                                <h5 id="organization-name">Organization</h5>
                            </div>
                        </div>
                        <div class="row address-row">
                            <div class="col flex-grow-1">
                                <p><small id="organization-address"></small></p>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col flex-grow-1">
                                <p><small id="organization-phone"></small></p>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col flex-grow-1">
                                <p id="organization-section"></p>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col flex-grow-1">
                                <p id="organization-description"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="main-content flex-grow-1">
            <button type="button" class="icon-button btn position-fixed top-0 end-0 m-3 z1000 ">
                <img src="./icons/legend.svg" alt="" aria-hidden="true" width="30" height="30" class="ui-button button-dk svg">
            </button>
            <div class="legend hidden"></div>
            <div id="myMap" class="container-fluid ">
                <script type="module" src="leafletMap.js"></script>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        function toggleSidebar() {
            document.querySelector('#sidebar').classList.toggle('collapsed');
            //document.querySelector('.leaflet-left').classList.toggle('collapsed')
        }
    </script>
</body>
</html>
